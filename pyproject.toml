[project]
name = "notification-service"
version = "0.1.0"
description = "Сервис уведомлений для интернет-магазина"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.1.9",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "email-validator>=2.2",
    "aio-pika>=9.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "httpx2>=2.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true
